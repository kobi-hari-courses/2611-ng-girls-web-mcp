<button flat class="toggle" (click)="toggled.emit()">
  @if (item().completed) {
    ✓
  }
</button>
<div class="caption">
  @if (editMode()) {
    <input
      type="text"
      #titleInput
      value="{{ item().title }}"
      (blur)="commit(titleInput.value)"
      (keyup.enter)="commit(titleInput.value)"
      (keyup.esc)="titleInput.value = item().title; cancel()"
    />
  } @else {
    <button transparent
      [class.completed]="item().completed" 
      (click)="startEditMode()">
      {{ item().title }}
    </button>
  }
</div>
<div class="delete">
    <button icon danger (click)="deleted.emit()">
        🗑︎      
    </button>
</div>
