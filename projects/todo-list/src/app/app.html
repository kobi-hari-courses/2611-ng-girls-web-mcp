<h1>My Todos</h1>
<app-input-button-unit
  (added)="todoList.addItem($event)"
/>

<div class="items">
  @for(item of todoList.items(); track item.id) {
    <app-todo-item [item]="item"
      (deleted)="todoList.removeItem($index)"
      (toggled)="todoList.toggleItem($index)"
      (renamed)="todoList.renameItem($index, $event)"
      animate.enter="todo-enter"
      animate.leave="todo-leave"
    />
  }
</div>
